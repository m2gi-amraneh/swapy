<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/chat"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="chat-header" *ngIf="otherUser">
        <ion-avatar>
          <img [src]="otherUser.photoURL || 'assets/default-avatar.png'" alt="Photo de profil">
        </ion-avatar>
        <div class="user-info">
          <h2>{{ otherUser.displayName || 'Utilisateur' }}</h2>
          <p *ngIf="otherUser.isOnline">En ligne</p>
        </div>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Loading state -->
  <div *ngIf="isLoading" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Chargement des messages...</p>
  </div>

  <!-- Error message -->
  <ion-card *ngIf="error && !isLoading" color="danger">
    <ion-card-header>
      <ion-card-title>
        <ion-icon name="alert-circle-outline"></ion-icon>
        Erreur
      </ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>{{ error }}</p>
      <ion-button expand="block" (click)="loadMessages()" class="ion-margin-top">
        Réessayer
      </ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Messages -->
  <div class="message-container" #messageContainer *ngIf="!isLoading && !error">
    <div *ngIf="messages.length > 0; else noMessages">
      <div class="message-group" *ngFor="let message of messages; let i = index; let isLast = last">
        <div class="message" [ngClass]="getMessageClasses(message)">
          <div class="message-content">{{ message.content }}</div>
          <div class="message-time">
            {{ getFormattedDate(message.timestamp) }}
            <ion-icon 
              name="checkmark-done" 
              *ngIf="message.senderId === currentUserId && message.read"
              class="read-status">
            </ion-icon>
          </div>
        </div>
      </div>
    </div>
    
    <ng-template #noMessages>
      <div class="empty-messages">
        <ion-icon name="chatbubbles-outline"></ion-icon>
        <p>Aucun message. Commencez la conversation !</p>
      </div>
    </ng-template>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <form (ngSubmit)="sendMessage()">
      <div class="message-input-container">
        <ion-input 
          type="text" 
          placeholder="Tapez votre message..." 
          [(ngModel)]="newMessage" 
          name="newMessage"
          autocomplete="off"
          enterkeyhint="send">
        </ion-input>
        <ion-button type="submit" fill="clear" [disabled]="!newMessage.trim()">
          <ion-icon name="send"></ion-icon>
        </ion-button>
      </div>
    </form>
  </ion-toolbar>
</ion-footer>
