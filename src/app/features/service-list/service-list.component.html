<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="search-container">
    <app-service-search (searchChange)="onSearch($event)"></app-service-search>
  </div>

  <div class="categories-container">
    <ion-scroll scrollX="true">
      <div class="categories">
        <ion-chip 
          [class.selected]="!selectedCategory" 
          (click)="filterByCategory(null)">
          <ion-label>Tous</ion-label>
        </ion-chip>
        <ion-chip 
          *ngFor="let category of categories" 
          [class.selected]="selectedCategory === category" 
          (click)="filterByCategory(category)">
          <ion-label>{{ category }}</ion-label>
        </ion-chip>
      </div>
    </ion-scroll>
  </div>

  <div class="services-container">
    <ng-container *ngIf="(filteredServices$ | async) as services; else loading">
      <div *ngIf="services.length > 0; else noServices">
        <app-service-card 
          *ngFor="let service of services" 
          [service]="service">
        </app-service-card>
      </div>
      
      <ng-template #noServices>
        <div class="no-services">
          <ion-icon name="search-outline"></ion-icon>
          <h3>Aucun service trouvé</h3>
          <p>Essayez de modifier vos critères de recherche</p>
        </div>
      </ng-template>
    </ng-container>
    
    <ng-template #loading>
      <div class="loading-container">
        <ion-skeleton-text animated style="width: 100%; height: 200px;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 100%; height: 200px;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width: 100%; height: 200px;"></ion-skeleton-text>
      </div>
    </ng-template>
  </div>
  
  <!-- Floating Action Button for creating a new service -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/services/create">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
